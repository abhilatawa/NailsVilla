spring:
  application:
    name: nailsvilla-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nailsvilla}
    username: ${DATABASE_USERNAME:nailsvilla}
    password: ${DATABASE_PASSWORD:nailsvilla}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    # Real SMTP (SmtpNotificationService) is only used when MAIL_USERNAME is set;
    # otherwise notifications are just logged (LoggingNotificationService).
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    # No real mail transport is configured until notifications ship (Phase 7);
    # don't let the unconfigured SMTP connection fail the overall health check.
    mail:
      enabled: false

nailsvilla:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  notifications:
    from-address: ${MAIL_FROM:no-reply@localhost}
    salon-email: ${SALON_NOTIFICATION_EMAIL:}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  salon:
    name: ${SALON_NAME:Nails Villa}
    timezone: ${SALON_TIMEZONE:America/Halifax}
    currency: ${SALON_CURRENCY:CAD}
    city: ${SALON_CITY:Halifax}
    province: ${SALON_PROVINCE:Nova Scotia}
    country: ${SALON_COUNTRY:Canada}

logging:
  level:
    root: INFO
    com.nailsvilla: INFO
